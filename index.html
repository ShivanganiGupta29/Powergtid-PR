<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PR Management System</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <!-- LOGIN -->
  <section id="loginSection">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" />
    <button id="loginBtn">Login</button>
  </section>

  <!-- APP -->
  <section id="appSection" class="hidden">
    <h2>Purchase Requisition</h2>

    <!-- SEARCH -->
    <div class="search-dropdown-container">
      <input type="text" id="searchInput" placeholder="Search item" />
      <div id="searchResults" class="dropdown hidden"></div>
    </div>

    <!-- ITEM FORM -->
    <div class="form">
      <input type="number" id="quantity" placeholder="Quantity" />
      <input type="number" id="unitPrice" placeholder="Unit Price" />
      <select id="vendorSource">
        <option value="">Select Vendor</option>
        <option>OEM</option>
        <option>Authorized Dealer</option>
        <option>Local Vendor</option>
      </select>
      <label>
        <input type="checkbox" id="manualItemToggle" /> Manual Item
      </label>
      <input type="text" id="manualDescription" class="hidden" placeholder="Item Description" />
      <label>
        <input type="checkbox" id="emergencyFlag" /> Emergency
      </label>

      <button id="addItemBtn">Add Item</button>
    </div>

    <!-- ITEMS TABLE -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Vendor</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="itemsTable"></tbody>
      </table>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button id="saveDraftBtn">Save Draft</button>
      <button id="submitPRBtn">Submit PR</button>
      <button id="clearAllBtn">Clear All</button>
    </div>

    <p id="prStatus"></p>
  </section>

  <!-- SCRIPT ORDER IS CRITICAL -->
  <script src="data.js"></script>
  <script src="prManager.js"></script>
  <script src="app.js"></script>
</body>
</html>
